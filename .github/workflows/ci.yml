name: CI/CD Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci --legacy-peer-deps
      - name: Dependency Security Audit
        run: npm audit --audit-level=critical
      - name: TypeScript check
        run: npx tsc -b
      - name: Lint
        run: npm run lint
      - name: Unit/Integration tests
        run: npm run test:run
      - name: Build
        run: npm run build
