<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <link rel="icon" type="image/x-icon" href="/HostelEnglishPWA/favicon.ico" />
  <link rel="icon" type="image/png" sizes="192x192" href="/HostelEnglishPWA/icons/pwa-192x192.png" />
  <link rel="shortcut icon" href="/HostelEnglishPWA/favicon.ico" />
  <link rel="apple-touch-icon" href="/HostelEnglishPWA/icons/pwa-192x192.png" />

  <!-- SEO Meta Tags -->
  <meta name="description" content="HostelEnglish: La app definitiva para dominar el vocabulario profesional de hostelería en inglés y euskera. Frases, diálogos, flashcards y exámenes interactivos." />
  <meta name="theme-color" content="#1a252f" />
  <meta property="og:title" content="HostelEnglish — Aprende inglés para hostelería" />
  <meta property="og:description" content="Domina el vocabulario y las expresiones esenciales para destacar en el mundo de la hostelería profesional." />
  <meta property="og:type" content="website" />

  <!-- Google Font: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">

  <!-- Seguridad y CSP -->
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; connect-src 'self' https://*.googleapis.com https://*.google.com https://translate.google.com https://*.workers.dev; media-src 'self' https://translate.google.com data:; font-src 'self' https://fonts.gstatic.com; form-action 'self'; base-uri 'self'; object-src 'none';">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta name="referrer" content="no-referrer-when-downgrade">

  <title>HostelEnglish — Aprende inglés para hostelería</title>

  <!-- Splash inline: se muestra antes de que ejecute el bundle JS -->
  <style id="splash-styles">
    #splash {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #1a252f;
      color: #fff;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      transition: opacity 0.3s ease-out;
    }
    #splash.hidden {
      opacity: 0;
      pointer-events: none;
    }
    #splash-spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(243, 156, 18, 0.3);
      border-top-color: #f39c12;
      border-radius: 50%;
      animation: splash-spin 0.8s linear infinite;
      margin-bottom: 24px;
    }
    #splash-title {
      font-size: 1.5rem;
      font-weight: 900;
      letter-spacing: -0.02em;
      text-transform: uppercase;
    }
    #splash-sub {
      font-size: 0.875rem;
      color: #9ca3af;
      margin-top: 8px;
      animation: splash-pulse 1.5s ease-in-out infinite;
    }
    #splash-recovery {
      display: none;
      flex-direction: column;
      align-items: center;
      margin-top: 24px;
      padding: 0 24px;
      text-align: center;
    }
    #splash-recovery.visible { display: flex; }
    #splash-recovery button {
      background: #f39c12;
      color: #1a252f;
      border: 0;
      border-radius: 12px;
      padding: 12px 20px;
      font: inherit;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      min-height: 44px;
    }
    @keyframes splash-spin {
      to { transform: rotate(360deg); }
    }
    @keyframes splash-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
  </style>
  <script>
    /* Anti-FOUC: aplica el tema antes del primer pintado */
    (function () {
      try {
        var t = localStorage.getItem("he-theme");
        if (t === "light" || (t === "auto" && window.matchMedia("(prefers-color-scheme: light)").matches)) document.documentElement.classList.add("light");
      } catch (e) {}
    })();
  </script>
</head>

<body>
  <!-- Splash nativo: se oculta automáticamente cuando React monta -->
  <div id="splash" aria-hidden="true">
    <div id="splash-spinner"></div>
    <div id="splash-title">HostelEnglish</div>
    <div id="splash-sub">Cargando...</div>
    <div id="splash-recovery" role="alert">
      <button id="splash-recovery-btn" type="button">¿Tarda demasiado? Pulsa aquí para limpiar caché y recargar</button>
    </div>
  </div>

  <div id="root"></div>
  <script id="splash-recovery-script">
    /* Recuperación del splash (BUG-01): si el bundle no arranca en 3 s, o hay un
       error global / fallo de chunk antes de montar, ofrece limpiar SW + cachés y recargar. */
    (function () {
      var splash = document.getElementById("splash");
      var box = document.getElementById("splash-recovery");
      var btn = document.getElementById("splash-recovery-btn");
      if (!splash || !box || !btn) return;
      function show() {
        if (document.getElementById("splash")) box.classList.add("visible");
      }
      function clean() {
        btn.disabled = true;
        var jobs = [];
        try {
          if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
            jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
              return Promise.all(rs.map(function (r) { return r.unregister(); }));
            }));
          }
        } catch (e) {}
        try {
          if (window.caches && caches.keys) {
            jobs.push(caches.keys().then(function (ks) {
              return Promise.all(ks.map(function (k) { return caches.delete(k); }));
            }));
          }
        } catch (e) {}
        var done = false;
        function reload() {
          if (done) return;
          done = true;
          location.replace(location.pathname + "?r=" + Date.now() + location.hash);
        }
        Promise.all(jobs).then(reload, reload);
        setTimeout(reload, 2000);
      }
      btn.addEventListener("click", clean);
      setTimeout(show, 3000);
      window.addEventListener("error", show);
      window.addEventListener("unhandledrejection", show);
      window.addEventListener("vite:preloadError", show);
    })();
  </script>
  <script type="module" src="./src/main.tsx"></script>
</body>

</html>
